<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
 color:#111418;padding:18px;background:#fff;line-height:1.6}
button{font:inherit;font-size:14px;padding:8px 15px;border:1px solid #e4e7ec;border-radius:10px;
 background:#f6f7f9;color:#111418;cursor:pointer;transition:.15s}
button:hover{border-color:#2f6bff;color:#2f6bff}
.n{font-size:20px;font-weight:700;color:#2f6bff}
.hint{position:fixed;left:8px;bottom:6px;font-size:11px;color:#b6bcc6}
#dot{width:70px;height:70px;border-radius:50%;background:#9333a8;animation:pp 1.6s ease-in-out infinite}@keyframes pp{0%,100%{transform:scale(.3)}50%{transform:scale(1)}}
</style></head><body>
<div id="dot"></div>
<div class="hint">Lottie 数据的效果示意</div>

</body></html>
