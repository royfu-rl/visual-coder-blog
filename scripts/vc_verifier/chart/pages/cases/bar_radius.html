<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;font-family:"DejaVu Sans",sans-serif}
#wrap{width:900px;height:520px;padding:16px}</style>
<script src="/lib/chart.umd.js"></script></head>
<body><div id="wrap"><canvas id="c" width="900" height="520"></canvas></div>
<script>
// ===== 这一段模拟「模型写出来的图表代码」=====
const CATS = ['北京', '上海', '广州', '深圳', '成都', '杭州'];
const Q1 = [1280, 1640, 920, 1510, 760, 1050];
const Q2 = [1430, 1520, 1180, 1690, 1120, 980];
const COLORS = ['#4e79a7', '#f28e2b'];
const FONT = 'DejaVu Sans';
const RADIUS = 8;
const ANIM = 0;
const LEGEND_POS = 'top';
const Y_MIN = 0;
const CHART_TYPE = 'bar';

// 数据标签：自己写的插件，用 ctx.fillText 画在柱子顶上
const dataLabels = {
  id: 'dataLabels',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    ctx.save();
    ctx.font = '12px ' + FONT;
    ctx.fillStyle = '#333';
    ctx.textAlign = 'center';
    chart.data.datasets.forEach((ds, i) => {
      chart.getDatasetMeta(i).data.forEach((el, j) => {
        ctx.fillText(String(ds.data[j]), el.x, el.y - 5);
      });
    });
    ctx.restore();
  }
};

new Chart(document.getElementById('c'), {
  type: CHART_TYPE,
  data: {
    labels: CATS,
    datasets: [
      { label: 'Q1', data: Q1, backgroundColor: COLORS[0], borderRadius: RADIUS },
      { label: 'Q2', data: Q2, backgroundColor: COLORS[1], borderRadius: RADIUS }
    ]
  },
  options: {
    responsive: false,
    animation: ANIM ? { duration: ANIM } : false,
    layout: { padding: { top: 24 } },
    plugins: {
      legend: { position: LEGEND_POS, labels: { font: { family: FONT, size: 13 } } },
      title: { display: true, text: '2026 年六城充电桩新增数量', font: { family: FONT, size: 16 } },
      tooltip: { enabled: true }
    },
    scales: {
      x: { title: { display: true, text: '城市', font: { family: FONT } },
           ticks: { font: { family: FONT, size: 12 } } },
      y: { min: Y_MIN, beginAtZero: true,
           title: { display: true, text: '新增充电桩数量（台）', font: { family: FONT, size: 13 } },
           ticks: { font: { family: FONT, size: 12 } } }
    }
  },
  plugins: [dataLabels]
});
window.__chartReady = true;
</script></body></html>
