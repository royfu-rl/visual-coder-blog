<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#fff}#w{width:900px;height:520px;padding:16px}</style>
<script src="/lib/chart.umd.js"></script><div id="w"><canvas id="c" width="900" height="520"></canvas></div>
<script>
// 刻度标签强行不旋转、不省略，制造文字重叠；数据标签字号压到 7px
const CATS=['北京市朝阳区','上海市浦东新区','广州市天河区','深圳市南山区','成都市高新区','杭州市余杭区'];
const Q1=[1280,1640,920,1510,760,1050];
new Chart(document.getElementById('c'),{type:'bar',data:{labels:CATS,datasets:[{label:'Q1',data:Q1,backgroundColor:'#4e79a7'}]},
 options:{responsive:false,animation:false,plugins:{legend:{display:true}},
  scales:{x:{ticks:{maxRotation:0,minRotation:0,autoSkip:false,font:{size:22}}},
          y:{min:0,title:{display:true,text:'数量（台）'}}}},
 plugins:[{id:'dl',afterDatasetsDraw(ch){const x=ch.ctx;x.save();x.font='7px sans-serif';x.fillStyle='#bbb';x.textAlign='center';
   ch.getDatasetMeta(0).data.forEach((e,j)=>x.fillText(String(Q1[j]),e.x,e.y-3));x.restore();}}]});
window.__chartReady=true;
</script>
