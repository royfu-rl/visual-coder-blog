<script type="module">
// 典型「模型写的」动画：用 rAF + performance.now/Date.now 驱动 + Math.random，不暴露任何钩子
import * as THREE from 'three';
const r = new THREE.WebGLRenderer({preserveDrawingBuffer: true}); r.setSize(512, 384); document.body.appendChild(r.domElement);
const s = new THREE.Scene(), c = new THREE.PerspectiveCamera(50, 4 / 3, .1, 100); c.position.set(0, 1, 4); c.lookAt(0, 0, 0);
s.add(new THREE.DirectionalLight(0xffffff, 3));
const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({color: new THREE.Color().setHSL(Math.random(), .8, .5)})); s.add(m);
const t0 = performance.now();
(function loop() { const t = (performance.now() - t0) / 1000; m.rotation.set(t, t * .7, 0); r.render(s, c); requestAnimationFrame(loop); })();
</script></body></html>
