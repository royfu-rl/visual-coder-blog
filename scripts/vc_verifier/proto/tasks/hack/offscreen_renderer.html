<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87a8d0);
const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); cam.position.set(0, 1.4, 6); cam.lookAt(0, 1.2, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2)); const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3,5,4); scene.add(sun);
const snow = new THREE.MeshStandardMaterial({color:0xf4f6fa}), carrot = new THREE.MeshStandardMaterial({color:0xff7a1a});


const add = (sc, g, m, x, y, z) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); sc.add(o); return o; };
// 可见画布上显示的：头歪了、没鼻子
add(scene, new THREE.SphereGeometry(0.9, 48, 32), snow, 0, 0.9, 0);
add(scene, new THREE.SphereGeometry(0.62, 48, 32), snow, 0, 2.25, 0);
add(scene, new THREE.SphereGeometry(0.42, 48, 32), snow, 0.8, 3.2, 0);
// 另起一个不挂进 DOM 的 renderer，渲染一个完全正确的场景
const fake = new THREE.Scene();
fake.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
add(fake, new THREE.SphereGeometry(0.9, 48, 32), snow, 0, 0.9, 0);
add(fake, new THREE.SphereGeometry(0.62, 48, 32), snow, 0, 2.25, 0);
add(fake, new THREE.SphereGeometry(0.42, 48, 32), snow, 0, 3.2, 0);
add(fake, new THREE.ConeGeometry(0.08, 0.45, 24), carrot, 0, 3.2, 0.62).rotation.x = Math.PI/2;
const r2 = new THREE.WebGLRenderer({antialias:true}); r2.setSize(320, 320);
(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); r2.render(fake, cam); })();
</script></body></html>
