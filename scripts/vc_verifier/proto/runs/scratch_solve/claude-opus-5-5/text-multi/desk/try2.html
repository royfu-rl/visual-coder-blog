<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2129);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(1.9, 1.9, 2.9); cam.lookAt(0, 0.85, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const M = c => new THREE.MeshStandardMaterial({color: c});
const wood = M(0x9c6b3f), dark = M(0x2b3038), screen = M(0x4fc3f7), mug = M(0xe05a4a), lampC = M(0xf2c14e), keys = M(0x8a93a0);

const yDesk = 0.77;

// ── DESK ──────────────────────────────────────────────
const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 0.8), wood);
tableTop.position.set(0, 0.745, 0);
scene.add(tableTop);

const legGeo = new THREE.BoxGeometry(0.06, 0.72, 0.06);
[[-0.64, -0.35], [0.64, -0.35], [-0.64, 0.35], [0.64, 0.35]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(legGeo, wood);
    leg.position.set(x, 0.36, z);
    scene.add(leg);
});

// ── MONITOR (back-center) ──────────────────────────────
// Base and pole sit just behind the screen; the pole rises into the screen's back
const monBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.02, 32), dark);
monBase.position.set(0, yDesk + 0.01, -0.275);
scene.add(monBase);

const poleH = 0.32;
const monStand = new THREE.Mesh(new THREE.BoxGeometry(0.05, poleH, 0.05), dark);
monStand.position.set(0, yDesk + 0.02 + poleH / 2, -0.275);
scene.add(monStand);

const monScreen = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.4, 0.04), screen);
monScreen.position.set(0, yDesk + 0.02 + 0.22 + 0.20, -0.25);
monScreen.rotation.x = -0.18; // top leans back
scene.add(monScreen);

// ── KEYBOARD (front-center) ────────────────────────────
const keyboard = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.015, 0.16), keys);
keyboard.position.set(0, yDesk + 0.0075, 0.15);
scene.add(keyboard);

// ── MUG (right-front) with handle ─────────────────────
const mugMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.048, 0.13, 20), mug);
mugMesh.position.set(0.45, yDesk + 0.065, 0.22);
scene.add(mugMesh);

const mugHandle = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.009, 8, 16), mug);
mugHandle.position.set(0.45 + 0.055, yDesk + 0.068, 0.22);
scene.add(mugHandle);

// ── DESK LAMP (right-back) ────────────────────────────
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.02, 24), dark);
lampBase.position.set(0.45, yDesk + 0.01, -0.25);
scene.add(lampBase);

// Diagonal thin pole
const poleStart = new THREE.Vector3(0.45, yDesk + 0.02, -0.25);
const poleEnd   = new THREE.Vector3(0.22, yDesk + 0.40, 0.00);
const poleMid   = new THREE.Vector3().addVectors(poleStart, poleEnd).multiplyScalar(0.5);
const poleLen   = poleStart.distanceTo(poleEnd);
const poleDirV  = new THREE.Vector3().subVectors(poleEnd, poleStart).normalize();

const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, poleLen, 8), dark);
lampPole.position.copy(poleMid);
lampPole.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), poleDirV);
scene.add(lampPole);

// Yellow cone shade: apex attached at the pole tip, opening facing the desk center.
// ConeGeometry: apex at +Y, open base at -Y.
const deskCenter = new THREE.Vector3(0, yDesk, 0.05);
const toDesk     = new THREE.Vector3().subVectors(deskCenter, poleEnd).normalize();
const shadeH     = 0.14;
const shadePos   = poleEnd.clone().addScaledVector(toDesk, shadeH / 2); // apex sits on poleEnd

const lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.11, shadeH, 20), lampC);
lampShade.position.copy(shadePos);
lampShade.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), toDesk.clone().negate());
scene.add(lampShade);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
