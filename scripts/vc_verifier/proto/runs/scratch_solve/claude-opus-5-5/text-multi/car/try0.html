<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x11161c);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(3.0, 1.8, 3.4); cam.lookAt(0, 0.5, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const body = new THREE.MeshStandardMaterial({color: 0xd94f3d}), tire = new THREE.MeshStandardMaterial({color: 0x23262b});
const glass = new THREE.MeshStandardMaterial({color: 0x9fd4ef, transparent: true, opacity: 0.82, side: THREE.DoubleSide}),
      lamp = new THREE.MeshStandardMaterial({color: 0xf5e6a8});

// 底盘：扁长，沿 Z 轴延伸，前端朝 -Z
const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.22, 4.0), body);
chassis.position.set(0, 0.11, 0);
scene.add(chassis);

// 车厢：立于底盘之上，偏后（+Z 方向）
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.74, 2.2), body);
cabin.position.set(0, 0.22 + 0.37, 0.55); // 底部贴住底盘顶面，z=0.55 偏后
scene.add(cabin);

// 风挡：浅蓝色，斜置，位于车厢前端
// BoxGeometry(宽, 高, 厚)，绕 X 轴旋转使顶部向车后倾
const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.80, 0.04), glass);
windshield.rotation.x = -Math.PI * 0.26;      // 约 47° 后仰
windshield.position.set(0, 0.51, -0.36);       // 车厢前沿处
scene.add(windshield);

// 四个黑色轮子：CylinderGeometry 默认轴向为 Y，绕 Z 旋转 90° 使轴向变为 X（车身横向）
const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.20, 24);
for (const [x, y, z] of [
    [-1.02, 0.32, -1.25],   // 左前
    [ 1.02, 0.32, -1.25],   // 右前
    [-1.02, 0.32,  1.35],   // 左后
    [ 1.02, 0.32,  1.35],   // 右后
]) {
    const w = new THREE.Mesh(wheelGeo, tire);
    w.rotation.z = Math.PI / 2;  // 轴向转为 X（横向）
    w.position.set(x, y, z);
    scene.add(w);
}

// 两个浅黄色圆形前灯：位于底盘/车头前端面（z ≈ -2）
// CylinderGeometry 默认轴向 Y，绕 X 旋转 90° 使圆面朝前（-Z 方向）
const lampGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.06, 24);
for (const x of [-0.52, 0.52]) {
    const l = new THREE.Mesh(lampGeo, lamp);
    l.rotation.x = Math.PI / 2;
    l.position.set(x, 0.30, -2.02);
    scene.add(l);
}

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
