<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2129);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(1.9, 1.9, 2.9); cam.lookAt(0, 0.85, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const M = c => new THREE.MeshStandardMaterial({color: c});
const wood = M(0x9c6b3f), dark = M(0x2b3038), screen = M(0x4fc3f7), mug = M(0xe05a4a), lampC = M(0xf2c14e), keys = M(0x8a93a0);

// ── TABLE ──────────────────────────────────────────────────────────────────
const TY = 0.75; // tabletop surface y
const TW = 1.5, TD = 0.88, TH = 0.06;

const tabletop = new THREE.Mesh(new THREE.BoxGeometry(TW, TH, TD), wood);
tabletop.position.set(0, TY - TH / 2, 0);
scene.add(tabletop);

const legH = TY - TH, legW = 0.09;
const legGeo = new THREE.BoxGeometry(legW, legH, legW);
[[-0.67, -0.38], [0.67, -0.38], [-0.67, 0.38], [0.67, 0.38]].forEach(([x, z]) => {
  const leg = new THREE.Mesh(legGeo, wood);
  leg.position.set(x, legH / 2, z);
  scene.add(leg);
});

// ── MONITOR ────────────────────────────────────────────────────────────────
const MX = 0, MZ = -0.27;

const monBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.025, 32), dark);
monBase.position.set(MX, TY + 0.0125, MZ);
scene.add(monBase);

const poleH = 0.27;
const monPole = new THREE.Mesh(new THREE.BoxGeometry(0.065, poleH, 0.065), dark);
monPole.position.set(MX, TY + 0.025 + poleH / 2, MZ);
scene.add(monPole);

const tiltAngle = 0.21;
const screenW = 0.68, screenH = 0.40, screenD = 0.03;
const screenMesh = new THREE.Mesh(new THREE.BoxGeometry(screenW, screenH, screenD), screen);
screenMesh.rotation.x = -tiltAngle;
const poleTopY = TY + 0.025 + poleH;
screenMesh.position.set(
  MX,
  poleTopY + (screenH / 2) * Math.cos(tiltAngle) - 0.05,
  MZ - (screenH / 2) * Math.sin(tiltAngle)
);
scene.add(screenMesh);

// ── KEYBOARD ───────────────────────────────────────────────────────────────
const kbd = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.018, 0.19), keys);
kbd.position.set(-0.04, TY + 0.009, 0.14);
scene.add(kbd);

// ── MUG ────────────────────────────────────────────────────────────────────
const mugH = 0.1;
const mugMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.032, mugH, 18), mug);
mugMesh.position.set(0.49, TY + mugH / 2, 0.20);
scene.add(mugMesh);

// ── DESK LAMP ──────────────────────────────────────────────────────────────
const LX = 0.52, LZ = -0.26;

const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.025, 32), dark);
lampBase.position.set(LX, TY + 0.0125, LZ);
scene.add(lampBase);

// arm: short, slightly leaning toward the desk center
const armStartY = TY + 0.025;
const armTip = new THREE.Vector3(LX - 0.1, TY + 0.42, LZ + 0.04);
const armStart = new THREE.Vector3(LX, armStartY, LZ);
const armVec = armTip.clone().sub(armStart);
const armLen = armVec.length();
const armDir = armVec.clone().normalize();

const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, armLen, 8), dark);
armMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), armDir);
armMesh.position.copy(armStart.clone().add(armTip).multiplyScalar(0.5));
scene.add(armMesh);

// cone shade at arm tip — opening aimed at desk center
const deskTarget = new THREE.Vector3(0, TY, 0);
const shadeToDesk = deskTarget.clone().sub(armTip).normalize();
const shadeMesh = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.11, 16), lampC);
shadeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), shadeToDesk.clone().negate());
shadeMesh.position.copy(armTip);
scene.add(shadeMesh);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
