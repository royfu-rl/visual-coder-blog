<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x11161c);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(3.0, 1.8, 3.4); cam.lookAt(0, 0.5, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const body = new THREE.MeshStandardMaterial({color: 0xd94f3d}), tire = new THREE.MeshStandardMaterial({color: 0x23262b});
const glass = new THREE.MeshStandardMaterial({color: 0x9fd4ef}), lamp = new THREE.MeshStandardMaterial({color: 0xf5e6a8});

// 在这里把场景搭出来

const car = new THREE.Group();

// 底盘：扁长盒子（X 为车长方向，+X 为车头；Z 为车宽方向）
const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.38, 1.1), body);
chassis.position.set(0, 0.53, 0);
car.add(chassis);

// 车厢：坐在底盘上，略向车尾（-X）偏移
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.17, 0.38, 0.9), body);
cabin.position.set(-0.12, 0.91, 0);
car.add(cabin);

// 风挡：浅蓝色小斜板，位于车厢前端上沿，顶部向车尾倾斜
const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.28, 0.86), glass);
windshield.position.set(0.49, 0.98, 0);
windshield.rotation.z = 0.4;
car.add(windshield);

// 四个轮子：轴向沿 Z（车身横向）
const wheelGeo = new THREE.CylinderGeometry(0.31, 0.31, 0.2, 24);
[[0.7, 0.55], [0.7, -0.55], [-0.7, 0.55], [-0.7, -0.55]].forEach(([x, z]) => {
  const w = new THREE.Mesh(wheelGeo, tire);
  w.position.set(x, 0.31, z);
  w.rotation.x = Math.PI / 2;
  car.add(w);
});

// 两个前灯：浅黄色圆形灯，嵌在车头前端
const lampGeo = new THREE.SphereGeometry(0.1, 24, 16);
[-0.34, 0.34].forEach(z => {
  const l = new THREE.Mesh(lampGeo, lamp);
  l.position.set(1.12, 0.5, z);
  car.add(l);
});

scene.add(car);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
