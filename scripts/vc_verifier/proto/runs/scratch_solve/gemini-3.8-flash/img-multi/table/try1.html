<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x202830);
const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); cam.position.set(2.2, 2.0, 3.4); cam.lookAt(0, 0.7, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1)); const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(3,5,2); scene.add(sun);
const wood = new THREE.MeshStandardMaterial({color: 0xb07a3c}), cupMat = new THREE.MeshStandardMaterial({color: 0x3a9ad9});

// 桌面尺寸
const tableWidth = 1.6;
const tableDepth = 1.0;
const tableThickness = 0.08;
const legHeight = 0.8;
const legRadius = 0.045;

// 桌面
const topMesh = new THREE.Mesh(new THREE.BoxGeometry(tableWidth, tableThickness, tableDepth), wood);
topMesh.position.y = legHeight + tableThickness / 2;
scene.add(topMesh);

// 四条圆柱桌腿（分布在四角，留出较小悬挑）
const legGeo = new THREE.CylinderGeometry(legRadius, legRadius, legHeight, 32);
const legOffsetX = tableWidth / 2 - 0.08;
const legOffsetZ = tableDepth / 2 - 0.08;
const legY = legHeight / 2;

[
  [-legOffsetX, -legOffsetZ],
  [legOffsetX, -legOffsetZ],
  [-legOffsetX, legOffsetZ],
  [legOffsetX, legOffsetZ]
].forEach(([x, z]) => {
  const leg = new THREE.Mesh(legGeo, wood);
  leg.position.set(x, legY, z);
  scene.add(leg);
});

// 蓝色杯子（上大下小的杯形圆柱体，略微偏右、偏前）
const cupRadiusTop = 0.07;
const cupRadiusBottom = 0.052;
const cupHeight = 0.16;
const cupGeo = new THREE.CylinderGeometry(cupRadiusTop, cupRadiusBottom, cupHeight, 32);
const cup = new THREE.Mesh(cupGeo, cupMat);
cup.position.set(0.38, legHeight + tableThickness + cupHeight / 2, 0.06);
scene.add(cup);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
