<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x11161c);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(3.0, 1.8, 3.4); cam.lookAt(0, 0.5, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const body = new THREE.MeshStandardMaterial({color: 0xd94f3d}), tire = new THREE.MeshStandardMaterial({color: 0x23262b});
const glass = new THREE.MeshStandardMaterial({color: 0x9fd4ef}), lamp = new THREE.MeshStandardMaterial({color: 0xf5e6a8});

// 1. 扁长的底盘
const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.34, 0.88), body);
chassis.position.set(0, 0.29, 0);
scene.add(chassis);

// 2. 上面偏后的饱满车厢主体
const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.32, 0.70), body);
cabin.position.set(-0.16, 0.62, 0);
scene.add(cabin);

// 3. 车厢前端上半部分的浅蓝色斜置风挡
const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.70), glass);
windshield.position.set(0.33, 0.69, 0);
windshield.rotation.z = -16 * Math.PI / 180;
scene.add(windshield);

// 4. 四个黑色车轮（轴向沿横向 Z 轴）
const wheelGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.15, 32);
const wheelPositions = [
  [ 0.55, 0.22,  0.49],
  [ 0.55, 0.22, -0.49],
  [-0.60, 0.22,  0.49],
  [-0.60, 0.22, -0.49]
];
wheelPositions.forEach(([x, y, z]) => {
  const wheel = new THREE.Mesh(wheelGeo, tire);
  wheel.position.set(x, y, z);
  wheel.rotation.x = Math.PI / 2;
  scene.add(wheel);
});

// 5. 车头前端两个浅黄色圆形前灯
const lampGeo = new THREE.SphereGeometry(0.075, 16, 16);
[-0.26, 0.26].forEach(z => {
  const l = new THREE.Mesh(lampGeo, lamp);
  l.position.set(1.05, 0.29, z);
  scene.add(l);
});

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
