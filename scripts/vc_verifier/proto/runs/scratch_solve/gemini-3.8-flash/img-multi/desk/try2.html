<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2129);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(1.9, 1.9, 2.9); cam.lookAt(0, 0.85, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const M = c => new THREE.MeshStandardMaterial({color: c});
const wood = M(0x9c6b3f), dark = M(0x2b3038), screen = M(0x4fc3f7), mug = M(0xe05a4a), lampC = M(0xf2c14e), keys = M(0x8a93a0);

// 桌子
const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.045, 0.65), wood);
tableTop.position.set(0, 0.725, 0);
scene.add(tableTop);

const legGeo = new THREE.BoxGeometry(0.055, 0.705, 0.055);
const legOffsets = [
  [-0.62, -0.265],
  [ 0.62, -0.265],
  [-0.62,  0.265],
  [ 0.62,  0.265]
];
legOffsets.forEach(([x, z]) => {
  const leg = new THREE.Mesh(legGeo, wood);
  leg.position.set(x, 0.3525, z);
  scene.add(leg);
});

// 显示器（宽屏大底座，屏幕微后仰）
const monitorGroup = new THREE.Group();
monitorGroup.position.set(-0.08, 0.748, -0.15);

const monBase = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.015, 32), dark);
monBase.position.y = 0.0075;
monitorGroup.add(monBase);

const monPole = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.22, 0.035), dark);
monPole.position.set(0, 0.11, 0);
monitorGroup.add(monPole);

const monScreen = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.34, 0.02), screen);
monScreen.position.set(0, 0.24, 0.01);
monScreen.rotation.x = -0.1;
monitorGroup.add(monScreen);

scene.add(monitorGroup);

// 键盘（桌面中前部，与显示器对齐）
const keyboard = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.014, 0.13), keys);
keyboard.position.set(-0.08, 0.755, 0.14);
scene.add(keyboard);

// 红色马克杯（右前方）
const mugMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.026, 0.08, 24), mug);
mugMesh.position.set(0.38, 0.788, 0.11);
scene.add(mugMesh);

// 台灯（右后方，细杆在正面看斜向左上，侧面看垂直不偏）
const lampGroup = new THREE.Group();
lampGroup.position.set(0.48, 0.748, -0.16);

const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.015, 32), dark);
lampBase.position.y = 0.0075;
lampGroup.add(lampBase);

const lampArm = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.32, 16), dark);
lampArm.position.set(-0.075, 0.15, 0);
lampArm.rotation.z = 0.48;
lampGroup.add(lampArm);

const lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.09, 24), lampC);
lampShade.position.set(-0.155, 0.30, 0);
lampShade.rotation.z = 0.65;
lampGroup.add(lampShade);

scene.add(lampGroup);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
