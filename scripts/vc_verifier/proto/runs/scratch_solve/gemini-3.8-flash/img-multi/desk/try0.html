<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2129);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(1.9, 1.9, 2.9); cam.lookAt(0, 0.85, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const M = c => new THREE.MeshStandardMaterial({color: c});
const wood = M(0x9c6b3f), dark = M(0x2b3038), screen = M(0x4fc3f7), mug = M(0xe05a4a), lampC = M(0xf2c14e), keys = M(0x8a93a0);

// 桌子
const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.04, 0.65), wood);
tableTop.position.set(0, 0.73, 0);
scene.add(tableTop);

const legGeo = new THREE.BoxGeometry(0.05, 0.71, 0.05);
const legOffsets = [
  [-0.57, -0.25],
  [ 0.57, -0.25],
  [-0.57,  0.25],
  [ 0.57,  0.25]
];
legOffsets.forEach(([x, z]) => {
  const leg = new THREE.Mesh(legGeo, wood);
  leg.position.set(x, 0.355, z);
  scene.add(leg);
});

// 显示器（圆形底座、方形立杆、蓝色屏幕略微后仰）
const monitorGroup = new THREE.Group();
monitorGroup.position.set(-0.2, 0.75, -0.15);

const monBase = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.015, 32), dark);
monBase.position.y = 0.0075;
monitorGroup.add(monBase);

const monPole = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.22, 0.035), dark);
monPole.position.set(0, 0.12, 0);
monitorGroup.add(monPole);

const monScreen = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.3, 0.02), screen);
monScreen.position.set(0, 0.24, 0.01);
monScreen.rotation.x = -0.12; // 略微后仰
monitorGroup.add(monScreen);

scene.add(monitorGroup);

// 键盘（桌面中前部平放）
const keyboard = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.012, 0.1), keys);
keyboard.position.set(-0.2, 0.756, 0.12);
scene.add(keyboard);

// 红色马克杯（桌面右前方）
const mugMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.028, 0.075, 24), mug);
mugMesh.position.set(0.32, 0.7875, 0.12);
scene.add(mugMesh);

// 台灯（圆形底座、斜向细杆、朝向桌面中心的黄色锥形灯罩）
const lampGroup = new THREE.Group();
lampGroup.position.set(0.42, 0.75, -0.15);

const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.012, 24), dark);
lampBase.position.y = 0.006;
lampGroup.add(lampBase);

// 斜向细杆
const rodLength = 0.28;
const lampRod = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, rodLength, 16), dark);
lampRod.position.set(-0.065, 0.13, 0.02);
lampRod.rotation.z = 0.45;
lampRod.rotation.x = -0.12;
lampGroup.add(lampRod);

// 锥形灯罩（尖端朝上外侧，开口朝向桌面中心）
const lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.08, 24), lampC);
lampShade.position.set(-0.13, 0.265, 0.04);
lampShade.rotation.z = 0.55;
lampShade.rotation.x = -0.18;
lampShade.rotation.y = 0.1;
lampGroup.add(lampShade);

scene.add(lampGroup);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
