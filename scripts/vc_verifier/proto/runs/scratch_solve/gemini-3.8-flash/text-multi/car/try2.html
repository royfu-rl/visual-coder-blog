<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x11161c);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(3.0, 1.8, 3.4); cam.lookAt(0, 0.5, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const body = new THREE.MeshStandardMaterial({color: 0xd94f3d}), tire = new THREE.MeshStandardMaterial({color: 0x23262b});
const glass = new THREE.MeshStandardMaterial({color: 0x9fd4ef}), lamp = new THREE.MeshStandardMaterial({color: 0xf5e6a8});

// 底盘（扁长，沿 X 轴）
const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.3, 1.1), body);
chassis.position.set(0, 0.45, 0);
scene.add(chassis);

// 车厢（偏后，位于 -X 方向）
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.48, 0.95), body);
cabin.position.set(-0.35, 0.84, 0);
scene.add(cabin);

// 斜置风挡（位于车厢前端斜切面上，填补前端三角空隙）
const angle = Math.PI / 6;
const h = 0.48 / Math.cos(angle);
const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.04, h, 0.95), glass);
windshield.rotation.z = angle;
// 车厢前上角为 x = 0.15, y = 1.08；下端落在底盘顶面 y = 0.60, x = 0.15 + 0.48*tan(30°) ≈ 0.427
// 中心点位于:
windshield.position.set(0.288, 0.84, 0);
scene.add(windshield);

// 车厢前端斜坡填充（避免风挡与车厢之间悬空）
const fillerShape = new THREE.Shape();
fillerShape.moveTo(0, 0);
fillerShape.lineTo(0.48 * Math.tan(angle), 0);
fillerShape.lineTo(0, 0.48);
fillerShape.closePath();
const extrudeSettings = { steps: 1, depth: 0.948, bevelEnabled: false };
const fillerGeo = new THREE.ExtrudeGeometry(fillerShape, extrudeSettings);
fillerGeo.center();
const filler = new THREE.Mesh(fillerGeo, body);
filler.position.set(0.15 + (0.48 * Math.tan(angle)) / 3 - 0.04, 0.76, 0);
scene.add(filler);

// 左右各两个轮子（轴向沿车身横向 Z 轴）
const wheelGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.2, 24);
const wheelPositions = [
  [ 0.65, 0.25,  0.58],
  [ 0.65, 0.25, -0.58],
  [-0.65, 0.25,  0.58],
  [-0.65, 0.25, -0.58]
];
wheelPositions.forEach(([x, y, z]) => {
  const wheel = new THREE.Mesh(wheelGeo, tire);
  wheel.rotation.x = Math.PI / 2;
  wheel.position.set(x, y, z);
  scene.add(wheel);
});

// 车头前端两个圆形前灯
const lampGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.05, 20);
[-0.32, 0.32].forEach(z => {
  const headlight = new THREE.Mesh(lampGeo, lamp);
  headlight.rotation.z = Math.PI / 2;
  headlight.position.set(1.11, 0.45, z);
  scene.add(headlight);
});

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
