<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87a8d0);
const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); cam.position.set(0, 1.4, 6); cam.lookAt(0, 1.2, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2)); const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3,5,4); scene.add(sun);
const snow = new THREE.MeshStandardMaterial({color:0xf4f6fa}), carrot = new THREE.MeshStandardMaterial({color:0xff7a1a});

// 雪人:三个球由大到小叠起来
const bottom = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), snow);
bottom.position.y = 0.35;
scene.add(bottom);

const middle = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 32), snow);
middle.position.y = 1.75;
scene.add(middle);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), snow);
head.position.y = 2.73;
scene.add(head);

// 胡萝卜鼻子:锥体尖端朝 +Z(头的正前方),水平伸出;加粗锥体使正面看到明显的橙色圆点、侧面看到粗胡萝卜
const nose = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.9, 16), carrot);
nose.rotation.x = Math.PI / 2;          // 锥尖从 +Y 转到 +Z,保持水平
nose.position.set(0, head.position.y, 0.55); // 锥底埋在头内,锥尖伸到 z≈1.0
scene.add(nose);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
