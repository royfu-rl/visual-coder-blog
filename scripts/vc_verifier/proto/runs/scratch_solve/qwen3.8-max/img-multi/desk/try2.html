<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2129);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(1.9, 1.9, 2.9); cam.lookAt(0, 0.85, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const M = c => new THREE.MeshStandardMaterial({color: c});
const wood = M(0x9c6b3f), dark = M(0x2b3038), screen = M(0x4fc3f7), mug = M(0xe05a4a), lampC = M(0xf2c14e), keys = M(0x8a93a0);

// ---- 桌面工作台 ----
const TOP = 0.75;
function box(w,h,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); scene.add(m); return m; }
function cyl(rt,rb,h,mat,x,y,z){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),mat); m.position.set(x,y,z); scene.add(m); return m; }

// 桌子：桌面 + 四条方形桌腿
box(1.7,0.06,0.95,wood, 0,0.72,0);
box(0.07,0.69,0.07,wood, -0.78,0.345,-0.40);
box(0.07,0.69,0.07,wood,  0.78,0.345,-0.40);
box(0.07,0.69,0.07,wood, -0.78,0.345, 0.40);
box(0.07,0.69,0.07,wood,  0.78,0.345, 0.40);

// 显示器：圆形底座 + 方形立杆 + 蓝色屏幕（略微后仰）
cyl(0.14,0.15,0.025,dark, 0,TOP+0.0125,-0.28);
box(0.05,0.34,0.05,dark, 0,TOP+0.025+0.17,-0.28);
const scr = box(0.78,0.46,0.035,screen, 0,TOP+0.57,-0.30);
scr.rotation.x = -0.10; // 顶部朝后仰

// 键盘：中前部平放
box(0.55,0.025,0.20,keys, 0,TOP+0.0125,0.24);

// 红色马克杯：右前
cyl(0.055,0.06,0.14,mug, 0.60,TOP+0.07,0.26);

// 台灯：右后，圆形底座 + 斜细杆 + 黄色锥形灯罩（开口朝向桌面中心）
const lampBaseTop = new THREE.Vector3(0.62, TOP+0.02, -0.30);
const poleTop     = new THREE.Vector3(0.46, TOP+0.45, -0.13);
cyl(0.09,0.10,0.02,dark, lampBaseTop.x, TOP+0.01, lampBaseTop.z);
const poleDir = poleTop.clone().sub(lampBaseTop);
const pole = cyl(0.012,0.012,poleDir.length(),dark, 0,0,0);
pole.position.copy(lampBaseTop).addScaledVector(poleDir, 0.5);
pole.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), poleDir.clone().normalize());
// 灯罩：锥口（底面）朝向桌面中心 => 锥尖背向中心朝外上
const centerPt = new THREE.Vector3(0, TOP, 0.05);
const awayDir  = poleTop.clone().sub(centerPt).normalize(); // 锥尖方向
const shade = new THREE.Mesh(new THREE.ConeGeometry(0.09,0.17,24), lampC);
shade.position.copy(poleTop).addScaledVector(awayDir, 0.05); // 开口套在杆顶
shade.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), awayDir);
scene.add(shade);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
