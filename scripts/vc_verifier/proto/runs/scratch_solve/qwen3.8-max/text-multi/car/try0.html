<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x11161c);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(3.0, 1.8, 3.4); cam.lookAt(0, 0.5, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const body = new THREE.MeshStandardMaterial({color: 0xd94f3d}), tire = new THREE.MeshStandardMaterial({color: 0x23262b});
const glass = new THREE.MeshStandardMaterial({color: 0x9fd4ef}), lamp = new THREE.MeshStandardMaterial({color: 0xf5e6a8});

// 在这里把场景搭出来
const car = new THREE.Group();

const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.22, 2.7), body);
chassis.position.set(0, 0.36, 0);
car.add(chassis);

const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.62, 1.25), body);
cabin.position.set(0, 0.78, -0.35);
car.add(cabin);

const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.55, 0.05), glass);
windshield.position.set(0, 0.84, 0.31);
windshield.rotation.x = -0.35;
car.add(windshield);

const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.24, 24);
wheelGeo.rotateZ(Math.PI / 2);
const wheelPositions = [
  [ 0.62, 0.32,  0.85],
  [ 0.62, 0.32, -0.85],
  [-0.62, 0.32,  0.85],
  [-0.62, 0.32, -0.85]
];
for (const p of wheelPositions) {
  const wheel = new THREE.Mesh(wheelGeo, tire);
  wheel.position.set(p[0], p[1], p[2]);
  car.add(wheel);
}

const lampGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.08, 20);
lampGeo.rotateX(Math.PI / 2);
const lampL = new THREE.Mesh(lampGeo, lamp);
lampL.position.set(0.38, 0.42, 1.39);
car.add(lampL);

const lampR = lampL.clone();
lampR.position.x = -0.38;
car.add(lampR);

scene.add(car);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
