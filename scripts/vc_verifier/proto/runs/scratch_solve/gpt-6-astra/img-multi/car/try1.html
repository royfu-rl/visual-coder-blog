<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x11161c);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(3.0, 1.8, 3.4); cam.lookAt(0, 0.5, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const body = new THREE.MeshStandardMaterial({color: 0xd94f3d}), tire = new THREE.MeshStandardMaterial({color: 0x23262b});
const glass = new THREE.MeshStandardMaterial({color: 0x9fd4ef}), lamp = new THREE.MeshStandardMaterial({color: 0xf5e6a8});

// 保持相机不变，修正整辆车偏大的尺寸。
const car = new THREE.Group();
car.scale.setScalar(0.75);
car.position.y = 0.125;
scene.add(car);

// X 为纵向，+X 为车头，Z 为横向。
const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.46, 1.22), body);
chassis.position.set(0, 0.66, 0);
car.add(chassis);

// 车厢偏后，前端上缘向后收。
const cabinGeometry = new THREE.BoxGeometry(1.48, 0.5, 1.08);
const positions = cabinGeometry.attributes.position;
for (let i = 0; i < positions.count; i++) {
  if (positions.getX(i) > 0 && positions.getY(i) > 0) {
    positions.setX(i, positions.getX(i) - 0.1);
  }
}
positions.needsUpdate = true;
cabinGeometry.computeVertexNormals();
const cabin = new THREE.Mesh(cabinGeometry, body);
cabin.position.set(-0.15, 1.14, 0);
car.add(cabin);

// 风挡贴合车厢前端斜面。
const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.39, 1.0), glass);
windshield.rotation.z = Math.atan(0.1 / 0.5);
windshield.position.set(0.553, 1.14, 0);
car.add(windshield);

// 左右各两个黑色轮子，轮轴沿车身横向。
const wheelGeometry = new THREE.CylinderGeometry(0.38, 0.38, 0.22, 32);
for (const x of [-0.87, 0.87]) {
  for (const z of [-0.67, 0.67]) {
    const wheel = new THREE.Mesh(wheelGeometry, tire);
    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(x, 0.38, z);
    car.add(wheel);
  }
}

// 车头前端的两个浅黄色圆形前灯。
const lampGeometry = new THREE.SphereGeometry(0.125, 16, 12);
for (const z of [-0.4, 0.4]) {
  const headlight = new THREE.Mesh(lampGeometry, lamp);
  headlight.position.set(1.4, 0.66, z);
  car.add(headlight);
}

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
