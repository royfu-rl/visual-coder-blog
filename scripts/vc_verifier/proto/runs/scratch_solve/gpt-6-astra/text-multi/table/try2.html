<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202830);

const cam = new THREE.PerspectiveCamera(
  45, innerWidth / innerHeight, 0.1, 100
);
cam.position.set(2.2, 2.0, 3.4);
cam.lookAt(0, 0.7, 0);

const r = new THREE.WebGLRenderer({antialias:true});
r.setSize(innerWidth, innerHeight);
document.body.appendChild(r.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(3, 5, 2);
scene.add(sun);

const wood = new THREE.MeshStandardMaterial({color: 0xb07a3c});
const cupMat = new THREE.MeshStandardMaterial({color: 0x3a9ad9});
const cupInsideMat = new THREE.MeshStandardMaterial({color: 0x14547d});

// 桌面
const tabletop = new THREE.Mesh(
  new THREE.BoxGeometry(2, 0.12, 1.3),
  wood
);
tabletop.position.set(0, 1.1, 0);
scene.add(tabletop);

// 四条圆柱形桌腿，分布在桌面四角
const legGeometry = new THREE.CylinderGeometry(0.075, 0.075, 1.04, 32);
for (const x of [-0.85, 0.85]) {
  for (const z of [-0.5, 0.5]) {
    const leg = new THREE.Mesh(legGeometry, wood);
    leg.position.set(x, 0.52, z);
    scene.add(leg);
  }
}

// 杯子位置：桌面上、偏右且偏前
const cupPosition = new THREE.Vector3(0.38, 1.16, 0.25);

// 杯体：底部封闭，顶部敞开
const cupProfile = [
  new THREE.Vector2(0, 0),
  new THREE.Vector2(0.15, 0),
  new THREE.Vector2(0.15, 0.36),
  new THREE.Vector2(0.13, 0.36),
  new THREE.Vector2(0.13, 0.025),
  new THREE.Vector2(0, 0.025)
];

const cup = new THREE.Mesh(
  new THREE.LatheGeometry(cupProfile, 32),
  cupMat
);
cup.position.copy(cupPosition);
scene.add(cup);

// 深色杯内底，使杯口明显呈现为空心，而不是实心圆柱
const insideBottom = new THREE.Mesh(
  new THREE.CircleGeometry(0.125, 32),
  cupInsideMat
);
insideBottom.rotation.x = -Math.PI / 2;
insideBottom.position.set(
  cupPosition.x,
  cupPosition.y + 0.027,
  cupPosition.z
);
scene.add(insideBottom);

// 杯口圆环，强化敞口结构
const rim = new THREE.Mesh(
  new THREE.TorusGeometry(0.14, 0.012, 8, 32),
  cupMat
);
rim.rotation.x = Math.PI / 2;
rim.position.set(
  cupPosition.x,
  cupPosition.y + 0.36,
  cupPosition.z
);
scene.add(rim);

(function loop(){
  requestAnimationFrame(loop);
  r.render(scene, cam);
})();
</script>
</body></html>
