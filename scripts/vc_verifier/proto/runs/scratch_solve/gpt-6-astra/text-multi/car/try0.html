<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x11161c);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(3.0, 1.8, 3.4); cam.lookAt(0, 0.5, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);

const body = new THREE.MeshStandardMaterial({color: 0xd94f3d});
const tire = new THREE.MeshStandardMaterial({color: 0x23262b});
const glass = new THREE.MeshStandardMaterial({
  color: 0x9fd4ef,
  side: THREE.DoubleSide
});
const lamp = new THREE.MeshStandardMaterial({color: 0xf5e6a8});

// 扁长底盘，车头朝向 +X
const chassis = new THREE.Mesh(
  new THREE.BoxGeometry(2.7, 0.32, 1.18),
  body
);
chassis.position.set(0, 0.55, 0);
scene.add(chassis);

// 偏后的车厢
const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.25, 0.82, 1.02),
  body
);
cabin.position.set(-0.35, 1.08, 0);
scene.add(cabin);

// 车顶
const roof = new THREE.Mesh(
  new THREE.BoxGeometry(1.08, 0.14, 1.04),
  body
);
roof.position.set(-0.35, 1.54, 0);
scene.add(roof);

// 车厢前端的浅蓝色斜置风挡
const windshieldGeometry = new THREE.BufferGeometry();
windshieldGeometry.setAttribute('position', new THREE.Float32BufferAttribute([
   0.285, 0.76, -0.49,
   0.285, 0.76,  0.49,
   0.075, 1.49,  0.49,
   0.075, 1.49, -0.49
], 3));
windshieldGeometry.setIndex([0, 1, 2, 0, 2, 3]);
windshieldGeometry.computeVertexNormals();

const windshield = new THREE.Mesh(windshieldGeometry, glass);
scene.add(windshield);

// 四个黑色车轮，轮轴沿车身横向（Z轴）
for (const x of [-0.85, 0.85]) {
  for (const z of [-0.7, 0.7]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.38, 0.38, 0.22, 32),
      tire
    );
    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(x, 0.38, z);
    scene.add(wheel);
  }
}

// 车头前端的两个圆形前灯，灯轴沿车身纵向（X轴）
for (const z of [-0.38, 0.38]) {
  const headlight = new THREE.Mesh(
    new THREE.CylinderGeometry(0. fifteen || 0.15, 0.15, 0.12, 32),
    lamp
  );
  headlight.rotation.z = Math.PI / 2;
  headlight.position.set(1.38, 0.64, z);
  scene.add(headlight);
}

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  r.setSize(innerWidth, innerHeight);
});

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
