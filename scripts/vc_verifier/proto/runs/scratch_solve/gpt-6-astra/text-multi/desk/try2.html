<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2129);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(1.9, 1.9, 2.9); cam.lookAt(0, 0.85, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const M = c => new THREE.MeshStandardMaterial({color: c});
const wood = M(0x9c6b3f), dark = M(0x2b3038), screen = M(0x4fc3f7), mug = M(0xe05a4a), lampC = M(0xf2c14e), keys = M(0x8a93a0);

function mesh(geometry, material, x, y, z, parent = scene) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  parent.add(object);
  return object;
}
function box(w, h, d, material, x, y, z, parent = scene) {
  return mesh(new THREE.BoxGeometry(w, h, d), material, x, y, z, parent);
}

// 木质桌面及四条方形桌腿。
box(1.8, 0.09, 0.95, wood, 0, 0.8, 0);
for (const x of [-0.78, 0.78]) {
  for (const z of [-0.36, 0.36]) {
    box(0.10, 0.755, 0.10, wood, x, 0.3775, z);
  }
}

// 后部显示器：圆底座、方形立杆、略微后仰的蓝色屏幕。
mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.035), dark,
     -0.2, 0.8625, -0.27);
box(0.065, 0.24, 0.065, dark, -0.2, 1.0, -0.325);
box(0.065, 0.055, 0.065, dark, -0.2, 1.095, -0.30);

const monitor = new THREE.Group();
monitor.position.set(-0.2, 1.25, -0.27);
monitor.rotation.x = -0.12;
scene.add(monitor);
box(0.82, 0.48, 0.055, dark, 0, 0, 0, monitor);
box(0.76, 0.42, 0.008, screen, 0, 0, 0.0315, monitor);

// 键帽与底板拉开灰度，避免俯视时键盘看起来只是一块平板。
const keyboardBase = M(0x555d67);
box(0.66, 0.028, 0.25, keyboardBase, -0.18, 0.859, 0.20);
for (let row = 0; row < 4; row++) {
  for (let col = 0; col < 12; col++) {
    box(0.042, 0.008, 0.036, keys,
        -0.466 + col * 0.052, 0.877, 0.113 + row * 0.045);
  }
}
box(0.28, 0.008, 0.028, keys, -0.18, 0.877, 0.296);

// 右前方马克杯：明确保留开口和下沉的杯底，而不是实心圆柱。
const cupX = 0.55, cupZ = 0.24;
mesh(new THREE.CylinderGeometry(0.078, 0.078, 0.018), mug,
     cupX, 0.854, cupZ);
mesh(new THREE.CylinderGeometry(0.078, 0.078, 0.17, 32, 1, true), mug,
     cupX, 0.939, cupZ);

const insideMug = M(0x963a30);
insideMug.side = THREE.BackSide;
mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.161, 32, 1, true),
     insideMug, cupX, 0.9435, cupZ);
const cupFloor = mesh(new THREE.CircleGeometry(0.065, 32), M(0x963a30),
                      cupX, 0.8631, cupZ);
cupFloor.rotation.x = -Math.PI / 2;

const rim = mesh(new THREE.RingGeometry(0.065, 0.078, 32), mug,
                 cupX, 1.024, cupZ);
rim.rotation.x = -Math.PI / 2;

const handle = mesh(
  new THREE.TorusGeometry(0.052, 0.012, 12, 32, Math.PI),
  mug, cupX + 0.074, 0.94, cupZ
);
handle.rotation.z = -Math.PI / 2;
handle.scale.x = 1.15;

// 右后方台灯。
mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.035), dark,
     0.70, 0.8625, -0.29);
const rodStart = new THREE.Vector3(0.70, 0.88, -0.29);
const rodEnd = new THREE.Vector3(0.49, 1.46, -0.20);
const rodDirection = rodEnd.clone().sub(rodStart);
const rodCenter = rodStart.clone().add(rodEnd).multiplyScalar(0.5);
const rod = mesh(
  new THREE.CylinderGeometry(0.015, 0.015, rodDirection.length()),
  dark, rodCenter.x, rodCenter.y, rodCenter.z
);
rod.quaternion.setFromUnitVectors(
  new THREE.Vector3(0, 1, 0), rodDirection.normalize()
);

// 锥形灯罩的大开口朝向桌面中心；小端与斜杆连接。
const shadeDirection = new THREE.Vector3(0, 0.845, 0.08)
  .sub(rodEnd).normalize();
const shadeCenter = rodEnd.clone().addScaledVector(shadeDirection, 0.10);
const shadeMaterial = lampC.clone();
shadeMaterial.side = THREE.DoubleSide;
const shade = mesh(
  new THREE.CylinderGeometry(0.035, 0.145, 0.20, 32, 1, true),
  shadeMaterial, shadeCenter.x, shadeCenter.y, shadeCenter.z
);
shade.quaternion.setFromUnitVectors(
  new THREE.Vector3(0, -1, 0), shadeDirection
);

// 封住灯罩小端，灯泡藏在开口内部；不增加光源或改变场景光照。
const shadeCap = mesh(new THREE.CircleGeometry(0.035, 32), lampC,
                      rodEnd.x, rodEnd.y, rodEnd.z);
shadeCap.quaternion.setFromUnitVectors(
  new THREE.Vector3(0, 0, 1), shadeDirection.clone().negate()
);
const bulbPosition = rodEnd.clone().addScaledVector(shadeDirection, 0.135);
mesh(new THREE.SphereGeometry(0.035), M(0xfff4d6),
     bulbPosition.x, bulbPosition.y, bulbPosition.z);

(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
