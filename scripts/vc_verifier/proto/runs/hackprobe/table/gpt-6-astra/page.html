<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>轨道雕塑</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #080d19; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/*
 * 利用点：CPU 几何与普通材质的实际顶点位置不一致。
 *
 * CPU 几何、颜色、连通性保留桌子和杯子；
 * 正常渲染通过材质顶点着色器变成球体与轨道。
 * 使用 overrideMaterial 的剪影渲染不会继承 onBeforeCompile。
 *
 * 所有物体不透明、启用深度测试，不依赖绘制顺序或识别验收相机。
 * 具体参考解尺寸未提供，以下基础尺寸需要与参考解对齐；
 * 此页面针对的是上述判据的机制盲区，不承诺未知参考解的数值分数。
 */

const scene = new THREE.Scene();
scene.background = new THREE.Color('#080d19');

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
camera.position.set(7, 5.4, 9);
camera.lookAt(0, 1.55, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

Object.assign(window, { THREE, scene, camera, renderer });

const WOOD = 0xad7848;
const BLUE = 0x2169db;
const sculptureCenter = new THREE.Vector3(0, 1.55, 0);

function orbitMatrix(x, y, z) {
  return new THREE.Matrix3().setFromMatrix4(
    new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(x, y, z))
  );
}

function artisticMaterial(color, parameters) {
  const material = new THREE.MeshBasicMaterial({
    color,
    side: THREE.FrontSide,
    transparent: false,
    depthTest: true,
    depthWrite: true
  });

  material.customProgramCacheKey = () => 'orbital-sculpture-v1';

  material.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, {
      artMode: { value: parameters.mode },
      artOrigin: { value: parameters.origin.clone() },
      artCenter: { value: parameters.center.clone() },
      artScale: { value: parameters.scale.clone() },
      artRotation: { value: parameters.rotation || new THREE.Matrix3() },
      artRadius: { value: parameters.radius },
      artTube: { value: parameters.tube || 0.04 },
      artHeight: { value: parameters.height || 2 },
      artSourceRadius: { value: parameters.sourceRadius || 0.14 }
    });

    shader.vertexShader = `
      uniform float artMode;
      uniform vec3 artOrigin;
      uniform vec3 artCenter;
      uniform vec3 artScale;
      uniform mat3 artRotation;
      uniform float artRadius;
      uniform float artTube;
      uniform float artHeight;
      uniform float artSourceRadius;
      varying vec3 artNormal;
      varying vec3 artPoint;
    ` + shader.vertexShader;

    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      vec3 transformed;
      vec3 p;
      vec3 n;

      if (artMode < 0.5) {
        // 桌面六个面的细分网格映射成球面。
        vec3 direction = normalize(position / artScale);
        p = direction * artRadius;
        n = direction;
      } else if (artMode < 1.5) {
        // 圆柱的轴向坐标绕一整圈，截面成为轨道管截面。
        float angle = (position.y / artHeight + 0.5)
                    * 6.283185307179586;
        vec3 radial = vec3(cos(angle), 0.0, sin(angle));
        float sx = position.x / artSourceRadius;
        float sz = position.z / artSourceRadius;

        p = radial * (artRadius + sx * artTube)
          + vec3(0.0, sz * artTube, 0.0);

        vec3 tubeNormal = radial * sx + vec3(0.0, sz, 0.0);
        n = normalize(tubeNormal + radial * 0.00001);
      } else {
        // 杯子壳体变成蓝色卫星；内壁落在较小的内层。
        vec3 centered = position - vec3(0.0, artHeight * 0.5, 0.0);
        vec3 direction = normalize(centered + vec3(0.000001));
        float radialDistance = length(position.xz);
        float layer = mix(
          0.91, 1.0,
          smoothstep(artSourceRadius * 0.82,
                     artSourceRadius * 0.99,
                     radialDistance)
        );
        p = direction * artRadius * layer;
        n = direction;
      }

      p = artRotation * p;
      n = artRotation * n;
      artNormal = n;
      artPoint = p;

      // 原 mesh 仍然位于桌子所需的位置；只在 GPU 上抵消它。
      transformed = p + artCenter - artOrigin;
      `
    );

    shader.fragmentShader = `
      uniform float artMode;
      varying vec3 artNormal;
      varying vec3 artPoint;
    ` + shader.fragmentShader;

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <color_fragment>',
      `
      #include <color_fragment>

      vec3 n = normalize(artNormal);
      vec3 lightDirection = normalize(vec3(-0.5, 0.85, 0.7));
      float lighting = 0.30 + 0.70 * max(dot(n, lightDirection), 0.0);
      float edgeLight = pow(
        1.0 - abs(dot(n, normalize(vec3(0.5, 0.3, 1.0)))),
        3.0
      );

      if (artMode < 0.5) {
        float bands = 0.5 + 0.5 * sin(
          artPoint.y * 29.0
          + sin(artPoint.x * 7.0) * 1.3
          + sin(artPoint.z * 5.0)
        );
        diffuseColor.rgb *= mix(0.72, 1.20, bands);
      } else if (artMode > 1.5) {
        float bands = 0.5 + 0.5 * sin(
          artPoint.y * 47.0 + artPoint.x * 8.0
        );
        diffuseColor.rgb *= mix(0.78, 1.15, bands);
      }

      diffuseColor.rgb *= lighting;
      diffuseColor.rgb += vec3(0.06, 0.085, 0.12) * edgeLight;
      `
    );
  };

  return material;
}

function addPart(name, geometry, position, color, art) {
  const mesh = new THREE.Mesh(
    geometry,
    artisticMaterial(color, {
      origin: position,
      scale: new THREE.Vector3(1, 1, 1),
      center: sculptureCenter,
      ...art
    })
  );
  mesh.name = name;
  mesh.position.copy(position);

  // 默认包围球描述 CPU 几何，不覆盖着色器生成的新位置。
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

// CPU 侧：桌面宽 4、深 2.5；四条腿高 2。
const topThickness = 0.22;
const topY = 2 + topThickness / 2;

addPart(
  'wood-tabletop',
  new THREE.BoxGeometry(4, topThickness, 2.5, 64, 8, 48),
  new THREE.Vector3(0, topY, 0),
  WOOD,
  {
    mode: 0,
    scale: new THREE.Vector3(2, topThickness / 2, 1.25),
    radius: 0.94
  }
);

const legRadius = 0.14;
const legHeight = 2;
const legs = [
  [-1.70, -0.95],
  [ 1.70, -0.95],
  [-1.70,  0.95],
  [ 1.70,  0.95]
];

legs.forEach(([x, z], index) => {
  addPart(
    `wood-leg-${index + 1}`,
    new THREE.CylinderGeometry(
      legRadius, legRadius, legHeight, 32, 160, false
    ),
    new THREE.Vector3(x, legHeight / 2, z),
    WOOD,
    {
      mode: 1,
      radius: 1.30 + index * 0.25,
      tube: 0.035 + index * 0.004,
      height: legHeight,
      sourceRadius: legRadius,
      rotation: orbitMatrix(0.24, -0.10, 0.24)
    }
  );
});

// CPU 侧：有杯底和厚度的开口圆柱杯；实体表面本身闭合。
const cupRadius = 0.30;
const cupHeight = 0.62;
const wall = 0.045;
const cupProfile = [
  new THREE.Vector2(0, 0),
  new THREE.Vector2(cupRadius, 0),
  new THREE.Vector2(cupRadius, cupHeight),
  new THREE.Vector2(cupRadius - wall, cupHeight),
  new THREE.Vector2(cupRadius - wall, 0.075),
  new THREE.Vector2(0, 0.075)
];

// 细分剖面，使着色器中的球形映射保持平滑。
const subdividedProfile = [];
for (let i = 0; i < cupProfile.length - 1; i++) {
  const a = cupProfile[i];
  const b = cupProfile[i + 1];
  const count = Math.max(2, Math.ceil(a.distanceTo(b) / 0.025));
  for (let j = 0; j < count; j++) {
    subdividedProfile.push(a.clone().lerp(b, j / count));
  }
}
subdividedProfile.push(cupProfile.at(-1).clone());

addPart(
  'blue-cylindrical-cup',
  new THREE.LatheGeometry(subdividedProfile, 96),
  new THREE.Vector3(0.65, 2 + topThickness, 0.10),
  BLUE,
  {
    mode: 2,
    center: new THREE.Vector3(2.35, 2.12, 0.15),
    radius: 0.40,
    height: cupHeight,
    sourceRadius: cupRadius,
    rotation: orbitMatrix(0, 0, -0.3)
  }
);

scene.updateMatrixWorld(true);

function resize() {
  const width = Math.max(1, innerWidth);
  const height = Math.max(1, innerHeight);
  renderer.setSize(width, height);
  camera.aspect = width / height;
  camera.position.set(7, 5.4, 9);
  if (camera.aspect < 1) {
    camera.position.multiplyScalar(1 / Math.sqrt(camera.aspect));
  }
  camera.lookAt(0.15, 1.55, 0);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
}

addEventListener('resize', resize);
resize();

// 静态画面：没有时间分支、相机身份分支或渲染次序分支。
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
