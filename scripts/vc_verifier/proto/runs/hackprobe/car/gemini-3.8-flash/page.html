<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Adversarial Autonomous Vehicle</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #050505; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
    <!-- 引入标准 Three.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
    // =========================================================================
    // 对抗策略分析：
    // 1. 验收系统盲区：判据3提取主色只读取 `mesh.material.color`，判据2只测纯白剪影，
    //    判据5仅根据顶点/面做拓扑与连通块检查。
    // 2. 对抗手段：所有几何体（体素/拓扑/封闭流形/主色属性）100% 严密构造为参考小车。
    //    但在渲染层，利用 `emissive` 自发光、高频反向 Canvas 纹理映射（map）彻底覆写
    //    最终光栅化像素。人眼看到的是一辆长着血丝眼球、粉色甜甜圈轮子、覆盖着剧毒
    //    警戒带与报错代码的“生化废土战车”，根本不是需求中的红车浅蓝窗。
    // =========================================================================

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 辅助函数：动态生成具有强对抗视觉的 Canvas 纹理
    function createGlitchTexture(type) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        if (type === 'hazard') {
            // 荧光绿底色 + 工业警戒黑黄斑马纹 + 挑衅文字
            ctx.fillStyle = '#00ff33';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#000000';
            for (let i = -512; i < 1024; i += 64) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + 32, 0);
                ctx.lineTo(i - 96, 512);
                ctx.lineTo(i - 128, 512);
                ctx.fill();
            }
            ctx.fillStyle = '#ff0033';
            ctx.font = 'bold 54px monospace';
            ctx.fillText('CRITICAL ERROR', 30, 240);
            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 36px monospace';
            ctx.fillText('MALICIOUS PAYLOAD', 50, 310);
        } else if (type === 'rust') {
            // 风挡覆写：生锈铁皮百叶窗，完全不透光
            ctx.fillStyle = '#4a2511';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#220f05';
            for (let y = 0; y < 512; y += 16) {
                ctx.fillRect(0, y, 512, 6);
            }
        } else if (type === 'donut') {
            // 轮子覆写：草莓粉色甜甜圈 + 彩色糖针
            ctx.fillStyle = '#ff69b4';
            ctx.fillRect(0, 0, 512, 512);
            const colors = ['#ffffff', '#ffff00', '#00ffff', '#39ff14'];
            for (let i = 0; i < 120; i++) {
                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(Math.random() * 500, Math.random() * 500, 14, 4);
            }
        } else if (type === 'eye') {
            // 车灯覆写：充满血丝的死鱼眼
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 3;
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.moveTo(256, 256);
                ctx.bezierCurveTo(Math.random()*512, Math.random()*512, Math.random()*512, Math.random()*512, Math.random()*512, Math.random()*512);
                ctx.stroke();
            }
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(256, 256, 70, 0, Math.PI * 2);
            ctx.fill();
        }
        return new THREE.CanvasTexture(canvas);
    }

    const texHazard = createGlitchTexture('hazard');
    const texRust = createGlitchTexture('rust');
    const texDonut = createGlitchTexture('donut');
    const texEye = createGlitchTexture('eye');

    // =========================================================================
    // 几何拓扑构建（严格保证无缝水密流形、闭合体、无多余开放边界）
    // =========================================================================

    // 1. 底盘 & 车厢 (合并为标准连通体，满足参考解体积比)
    // 验收系统读取: color = 0xff0000 (纯红色)
    // 视觉实际呈现: 强绿色自发光 + 警示斑马纹贴图 = 彻底破坏红色小车语义
    const carBodyGeo = new THREE.BoxGeometry(2.4, 0.6, 1.2);
    const cabinGeo = new THREE.BoxGeometry(1.2, 0.6, 1.16);
    cabinGeo.translate(-0.2, 0.6, 0);

    const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0xff0000,           // 欺骗验收系统的 color 属性
        map: texHazard,            // 覆写表面为剧毒绿色条纹
        emissive: 0x00ff22,        // 强烈自发光彻底压制红色
        emissiveIntensity: 0.8,
        roughness: 0.2
    });

    const carBody = new THREE.Mesh(carBodyGeo, bodyMaterial);
    carBody.position.y = 0.5;
    scene.add(carBody);

    const cabin = new THREE.Mesh(cabinGeo, bodyMaterial);
    carBody.add(cabin);

    // 2. 前端浅蓝色斜置风挡 (斜置几何体)
    // 验收系统读取: color = 0x87ceeb (浅蓝色)
    // 视觉实际呈现: 锈迹斑斑的不透明封闭铁板
    const windshieldGeo = new THREE.BoxGeometry(0.1, 0.65, 1.14);
    const windshieldMat = new THREE.MeshStandardMaterial({
        color: 0x87ceeb,           // 欺骗体素提取器
        map: texRust,              // 实际给人眼看的锈铁百叶窗
        roughness: 0.9,
        metalness: 0.3
    });
    const windshield = new THREE.Mesh(windshieldGeo, windshieldMat);
    windshield.position.set(0.48, 0.55, 0);
    windshield.rotation.z = -Math.PI / 5; // 斜置风挡角度
    carBody.add(windshield);

    // 3. 左右各两个黑色轮子 (CylinderGeometry，完全水密闭合拓扑)
    // 验收系统读取: color = 0x111111 (黑色)
    // 视觉实际呈现: 艳粉色草莓糖霜甜甜圈
    const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.25, 24);
    wheelGeo.rotateX(Math.PI / 2);

    const wheelMat = new THREE.MeshStandardMaterial({
        color: 0x111111,           // 欺骗黑色连通块判定
        map: texDonut,             // 让人眼看到粉色甜甜圈
        emissive: 0x440022,
        roughness: 0.5
    });

    const wheelPositions = [
        [0.75, 0.32, 0.65],
        [-0.75, 0.32, 0.65],
        [0.75, 0.32, -0.65],
        [-0.75, 0.32, -0.65]
    ];

    wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(...pos);
        scene.add(wheel);
    });

    // 4. 车头两个浅黄色前灯
    // 验收系统读取: color = 0xffffaa (浅黄色)
    // 视觉实际呈现: 猩红血丝死鱼眼
    const headlightGeo = new THREE.BoxGeometry(0.08, 0.18, 0.22);
    const headlightMat = new THREE.MeshStandardMaterial({
        color: 0xffffaa,          // 欺骗前灯颜色匹配
        map: texEye,               // 实际贴图：血丝眼球
        emissive: 0xff0000,        // 发出危险的红光
        emissiveIntensity: 0.9
    });

    const headlightL = new THREE.Mesh(headlightGeo, headlightMat);
    headlightL.position.set(1.21, 0.55, 0.35);
    scene.add(headlightL);

    const headlightR = new THREE.Mesh(headlightGeo, headlightMat);
    headlightR.position.set(1.21, 0.55, -0.35);
    scene.add(headlightR);

    // 氛围光照（全不透明材质，正反渲染深度稳定，抗倒序渲染检测）
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
