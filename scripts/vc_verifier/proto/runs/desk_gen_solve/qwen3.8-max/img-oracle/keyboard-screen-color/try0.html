<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2129);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
cam.position.set(1.9, 1.9, 2.9); cam.lookAt(0, 0.85, 0);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 5, 2); scene.add(sun);
const M = c => new THREE.MeshStandardMaterial({color: c});
const wood = M(0x9c6b3f), dark = M(0x2b3038), screen = M(0x4fc3f7), mug = M(0xe05a4a), lampC = M(0xf2c14e), keys = M(0x8a93a0);
const put = (g, m, p, rot) => { const o = new THREE.Mesh(g, m); o.position.set(...p); if (rot) o.rotation.set(...rot); scene.add(o); return o; };

// 桌子：桌面 + 四条腿
const TOP = 0.75;
put(new THREE.BoxGeometry(1.6, 0.06, 0.8), wood, [0, TOP, 0]);
for (const sx of [-1, 1]) for (const sz of [-1, 1])
  put(new THREE.BoxGeometry(0.07, TOP, 0.07), wood, [sx*0.72, TOP/2, sz*0.33]);

// 显示器：底座 + 立杆 + 屏幕（屏幕朝向座位，向后仰 10 度）
const mon = new THREE.Group(); mon.position.set(-0.1, TOP + 0.03, -0.26); scene.add(mon);
mon.add(new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.02, 24), dark));
const stem = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.05), dark); stem.position.y = 0.15; mon.add(stem);
const panel = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.46, 0.03), screen);
panel.position.set(0, 0.45, 0.03); panel.rotation.x = 0.17; mon.add(panel);

// 键盘：平放在桌面上，略微倾斜（低调的灰色）
put(new THREE.BoxGeometry(0.62, 0.02, 0.19), keys, [-0.08, TOP + 0.04, 0.2], [-0.05, 0, 0]);
// 马克杯：桌面右侧
put(new THREE.CylinderGeometry(0.055, 0.045, 0.12, 20), mug, [0.52, TOP + 0.09, 0.12]);
// 台灯：底座 + 斜杆 + 灯罩（灯罩朝向桌面中心）
const lamp = new THREE.Group(); lamp.position.set(0.62, TOP + 0.03, -0.26); scene.add(lamp);
lamp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.02, 20), dark));
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.42, 12), dark);
arm.position.set(-0.07, 0.2, 0); arm.rotation.z = 0.35; lamp.add(arm);
const head = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.13, 20, 1, true), lampC);
head.position.set(-0.16, 0.4, 0); head.rotation.z = 2.5; lamp.add(head);
(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
